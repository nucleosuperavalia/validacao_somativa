<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Validação da prova somativa — AvaliaSESI-SP 2026</title>
<style>
:root{
  color-scheme: light;
  --bg:#f7f7f5; --surface:#fcfcfb; --surface-2:#f1f1ee; --linha:#dcdcd6;
  --txt:#0b0b0b; --txt2:#52514e; --txt3:#84837c;
  --etapa:#2a78d6; --conexao:#eb6834; --subst:#1baf7a;
  --ok:#008300; --alerta:#eda100; --erro:#e34948;
  --realce:#eef4fd;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#121211; --surface:#1a1a19; --surface-2:#232321; --linha:#34332f;
    --txt:#ffffff; --txt2:#c3c2b7; --txt3:#8d8c82;
    --etapa:#3987e5; --conexao:#d95926; --subst:#199e70;
    --ok:#4caf50; --alerta:#e8a93a; --erro:#e66767;
    --realce:#1d2733;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#121211; --surface:#1a1a19; --surface-2:#232321; --linha:#34332f;
  --txt:#ffffff; --txt2:#c3c2b7; --txt3:#8d8c82;
  --etapa:#3987e5; --conexao:#d95926; --subst:#199e70;
  --ok:#4caf50; --alerta:#e8a93a; --erro:#e66767;
  --realce:#1d2733;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--txt);font:14px/1.5 var(--sans);
     -webkit-text-size-adjust:100%}
.gutter{padding-inline:16px;max-width:1280px;margin:0 auto}

/* ---------- barra superior: compacta de propósito ---------- */
header{position:sticky;top:0;z-index:30;background:var(--surface);
       border-bottom:1px solid var(--linha)}
.topo{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;
      padding-block:7px}
.marca{font-weight:650;font-size:13px;letter-spacing:.01em;white-space:nowrap}
.marca small{display:block;font-weight:400;font-size:11px;color:var(--txt3);
             letter-spacing:.02em}
.seg{display:flex;border:1px solid var(--linha);border-radius:7px;overflow:hidden}
.seg button{border:0;background:var(--surface);color:var(--txt2);
            font:600 12px var(--sans);padding:5px 11px;cursor:pointer}
.seg button+button{border-left:1px solid var(--linha)}
.seg button[aria-pressed="true"]{background:var(--txt);color:var(--surface)}
.anos{display:flex;flex-wrap:wrap;gap:4px}
.anos button{border:1px solid var(--linha);background:var(--surface);
             color:var(--txt2);font:600 12px var(--mono);padding:4px 8px;
             border-radius:6px;cursor:pointer}
.anos button[aria-pressed="true"]{background:var(--etapa);border-color:var(--etapa);
             color:#fff}
.espaco{flex:1 1 auto;min-width:0}
.progresso{font:600 12px var(--mono);color:var(--txt2);white-space:nowrap;
           font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--linha);background:var(--surface);color:var(--txt);
     font:600 12px var(--sans);padding:5px 10px;border-radius:6px;cursor:pointer}
.btn:hover{background:var(--surface-2)}
.btn.primario{background:var(--etapa);border-color:var(--etapa);color:#fff}
nav.abas{display:flex;gap:2px;border-top:1px solid var(--linha);overflow-x:auto}
nav.abas button{border:0;border-bottom:2px solid transparent;background:none;
   color:var(--txt2);font:600 12.5px var(--sans);padding:7px 12px;cursor:pointer;
   white-space:nowrap}
nav.abas button[aria-selected="true"]{color:var(--txt);border-bottom-color:var(--txt)}

main{padding-block:16px 48px}
.cartao{background:var(--surface);border:1px solid var(--linha);border-radius:10px;
        padding:14px;margin-bottom:14px}
.cartao>h2{margin:0 0 2px;font-size:14px;letter-spacing:.01em}
.cartao>p.sub{margin:0 0 12px;font-size:12px;color:var(--txt3)}
.tiles{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));
       margin-bottom:14px}
.tile{background:var(--surface);border:1px solid var(--linha);border-radius:10px;
      padding:10px 12px;min-width:0}
.tile .n{font:650 21px/1.1 var(--sans);font-variant-numeric:tabular-nums}
.tile .r{font-size:11px;color:var(--txt3);margin-top:3px}
.tile.aviso{border-color:var(--alerta)}
.tile.aviso .n{color:var(--alerta)}
.legenda{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:11.5px;
         color:var(--txt2);margin-top:8px}
/* cabeçalho de cada histograma da aba Distribuição */
.gmeta.aviso{color:var(--alerta)}
.gtit{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px;
      margin:14px 0 2px;padding-top:10px;border-top:1px solid var(--linha)}
.gtit:first-child{border-top:0;padding-top:0;margin-top:2px}
.gtit b{font:600 13px var(--mono)}
.gtit span{font:11.5px var(--mono);color:var(--txt3)}
.gtit.atual b{color:var(--etapa)}
.gtit.atual span{color:var(--txt2)}
.legenda span{display:inline-flex;align-items:center;gap:5px}
.pt{width:9px;height:9px;border-radius:50%;display:inline-block;
    box-shadow:0 0 0 1.5px var(--surface)}
svg{display:block;max-width:100%;overflow:visible}
.rolagem{overflow-x:auto}

/* ---------- lista de validação ---------- */
.grupo{border:1px solid var(--linha);border-radius:9px;margin-bottom:10px;
       background:var(--surface);overflow:hidden}
.grupo>summary{list-style:none;cursor:pointer;padding:9px 12px;display:flex;
       gap:10px;align-items:flex-start}
.grupo>summary::-webkit-details-marker{display:none}
.grupo>summary:hover{background:var(--surface-2)}
.gtxt{flex:1 1 auto;min-width:0}
.gtxt b{font-weight:600;font-size:13px}
.gmeta{font:500 11px var(--mono);color:var(--txt3);margin-top:2px;
       font-variant-numeric:tabular-nums}
.sel{font:600 11px var(--mono);white-space:nowrap;font-variant-numeric:tabular-nums}
.item{border-top:1px solid var(--linha);padding:9px 12px;display:flex;
      gap:10px;flex-wrap:wrap;align-items:center}
.item.recusado{background:var(--surface-2);opacity:.62}
.item.aprovado{background:color-mix(in srgb,var(--ok) 7%,transparent)}
/* item que o analista trouxe de outro descritor para fechar uma vaga: ele
   aparece na caixa do descritor DELE, marcado, além de aparecer na vaga */
.item.adicional{background:color-mix(in srgb,var(--subst) 9%,transparent);
                border-left:3px solid var(--subst)}
.sinc{font:11.5px var(--mono);color:var(--txt3);max-width:360px;
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sinc.erro{color:var(--erro)}
.sinc.ok{color:var(--ok)}
.sinc{cursor:pointer}
.diag{position:fixed;right:14px;bottom:14px;z-index:50;max-width:min(560px,92vw);
      background:var(--surface);border:1px solid var(--linha);border-radius:10px;
      padding:14px 16px;box-shadow:0 10px 30px rgba(0,0,0,.18);font-size:12.5px}
.diag b{display:block;margin:6px 0 4px}
.diag p{margin:3px 0;color:var(--txt2)}
.diag p.erro{color:var(--erro)}
.diag pre{white-space:pre-wrap;word-break:break-all;background:var(--surface-2);
          padding:8px;border-radius:6px;max-height:190px;overflow:auto;
          font:11px var(--mono);margin:4px 0 10px}
.busca{width:100%;max-width:420px;padding:7px 10px;border-radius:7px;
       border:1px solid var(--linha);background:var(--surface);
       color:var(--txt);font:13px var(--mono)}
.resbusca{margin-top:6px}
.resbusca .vazio{margin:6px 0}
.cod{font:600 11.5px var(--mono);min-width:0;word-break:break-all;flex:1 1 180px}
.nums{font:500 11.5px var(--mono);color:var(--txt2);white-space:nowrap;
      font-variant-numeric:tabular-nums}
.chip{font:600 10px var(--sans);padding:2px 6px;border-radius:5px;
      border:1px solid var(--linha);color:var(--txt2);white-space:nowrap}
.chip.etapa{border-color:var(--etapa);color:var(--etapa)}
.chip.conexao{border-color:var(--conexao);color:var(--conexao)}
.chip.substituto{border-color:var(--subst);color:var(--subst)}
.chip.fora{border-color:var(--alerta);color:var(--alerta)}
.chip.ffacil{border-color:var(--ok);color:var(--ok)}
.chip.fmedio{border-color:var(--alerta);color:var(--alerta)}
.chip.fdificil{border-color:var(--erro);color:var(--erro)}
.chip.flivre{border-color:var(--txt3);color:var(--txt3)}
a.ver{font:600 11px var(--sans);padding:3px 9px;border-radius:5px;
      border:1px solid var(--etapa);color:var(--etapa);text-decoration:none;
      white-space:nowrap}
a.ver:hover{background:var(--etapa);color:#fff}
.acoes{display:flex;gap:5px;margin-left:auto}
.acoes button{border:1px solid var(--linha);background:var(--surface);
      color:var(--txt2);font:600 11px var(--sans);padding:3px 9px;
      border-radius:5px;cursor:pointer}
.acoes button[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);
      color:#fff}
.acoes button.nao[aria-pressed="true"]{background:var(--erro);
      border-color:var(--erro);color:#fff}
.troca{border-top:1px dashed var(--linha);padding:10px 12px;background:var(--surface-2)}
.troca h4{margin:0 0 7px;font-size:11.5px;color:var(--txt3);font-weight:600;
      text-transform:uppercase;letter-spacing:.05em}
.alt{display:flex;gap:9px;align-items:center;flex-wrap:wrap;padding:5px 0;
     border-top:1px solid var(--linha)}
.alt:first-of-type{border-top:0}
.vazio{font-size:12px;color:var(--txt3);font-style:italic}
.pend{border-left:3px solid var(--alerta)}
.pend .gtxt b{color:var(--alerta)}
.nota{font-size:12px;color:var(--txt2);background:var(--realce);
      border:1px solid var(--linha);border-radius:7px;padding:8px 11px;
      margin:0 0 12px}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{text-align:left;padding:5px 9px;border-bottom:1px solid var(--linha);
      white-space:nowrap}
th{font-weight:600;color:var(--txt3);font-size:11px;text-transform:uppercase;
   letter-spacing:.04em}
td.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.dica{position:fixed;pointer-events:none;z-index:50;background:var(--txt);
      color:var(--bg);font:500 11.5px/1.45 var(--mono);padding:6px 9px;
      border-radius:6px;opacity:0;transition:opacity .09s;max-width:260px;
      white-space:pre-line}
@media (max-width:620px){
  .acoes{margin-left:0;width:100%}
  .marca small{display:none}
}
</style>
</head>
<body>
<header>
  <div class="gutter topo">
    <div class="marca">Validação da prova somativa
      <small>AvaliaSESI-SP 2026 · novembro</small></div>
    <div class="seg" id="segComp"></div>
    <div class="anos" id="segAno"></div>
    <div class="espaco"></div>
    <div class="progresso" id="progresso">—</div>
    <div class="sinc" id="sinc" hidden></div>
    <button class="btn" id="btnImportar" title="carregar um arquivo de decisões já salvo">Abrir</button>
    <button class="btn primario" id="btnExportar" title="baixar as decisões em .json e .csv">Baixar decisões</button>
    <input type="file" id="arqImport" accept=".json" hidden>
  </div>
  <nav class="abas gutter" id="abas"></nav>
</header>
<main class="gutter" id="palco"></main>
<div class="dica" id="dica"></div>

<script>
const DADOS = {"gerado":"2026-10-23","anos":["3EF","4EF","5EF","6EF","7EF","8EF","9EF","1EM","2EM","3EM"],"desenho":{"3EF":{"caderno":24,"tb":8,"nb":10,"bc":3},"4EF":{"caderno":26,"tb":13,"nb":6,"bc":2},"5EF":{"caderno":26,"tb":13,"nb":6,"bc":2},"6EF":{"caderno":28,"tb":7,"nb":11,"bc":4},"7EF":{"caderno":28,"tb":7,"nb":11,"bc":4},"8EF":{"caderno":28,"tb":7,"nb":11,"bc":4},"9EF":{"caderno":28,"tb":7,"nb":11,"bc":4},"1EM":{"caderno":32,"tb":16,"nb":5,"bc":2},"2EM":{"caderno":32,"tb":16,"nb":5,"bc":2},"3EM":{"caderno":32,"tb":16,"nb":5,"bc":2}},"descritores":["Identificar a finalidade de textos de diferentes gêneros.","Identificar recursos coesivos em textos de diferentes gêneros.","Identificar as funções e/ou os efeitos de sentido do uso de sinais de pontuação.","Identificar o tema de textos de diferentes gêneros.","Identificar características estruturais de textos de diferentes gêneros.","Localizar informações explícitas em textos de diferentes gêneros.","Identificar padrões ortográficos na escrita das palavras, com base em palavras de referência.","Inferir informações implícitas em textos de diferentes gêneros.","Inferir o sentido figurado ou literal de uma palavra ou expressão a partir de seu contexto de uso.","Identificar o possível público-alvo de textos de diferentes gêneros.","Comparar textos de diferentes gêneros que tratam do mesmo tema.","Identificar classes gramaticais e seus usos em textos de diferentes gêneros.","Reconhecer elementos narrativos que caracterizam textos de diferentes gêneros (tempo, espaço, personagens, foco narrativo, enredo).","Identificar o conflito gerador de uma narrativa.","Estabelecer relações entre textos verbais e não verbais.","Identificar as marcas do tempo verbal predominante em um texto.","Distinguir fato de opinião em textos de diferentes gêneros.","Identificar marcas de variação linguística em situações comunicativas de uso.","Identificar correspondências entre dados apresentados em recursos gráfico-visuais e informações expressas no texto.","Identificar o uso do discurso direto e/ou indireto em textos de diferentes gêneros.","Reconhecer a funcionalidade sintática dos termos de uma oração.","Reconhecer o efeito de sentido de figuras de linguagem em textos de diferentes gêneros.","Identificar o tema, a finalidade e/ou o possível público-alvo de textos de diferentes gêneros.","Reconhecer a presença de valores culturais e sociais em diferentes tipos de produções artístico-literárias.","Estabelecer relações entre partes de um texto por meio de elementos coesivos.","Comparar o enfoque dado ao tratamento dos fatos em textos do campo jornalístico-midiático.","Identificar características estruturais e/ou marcas linguísticas de textos do campo jornalístico-midiático.","Identificar o efeito de sentido produzido pelo uso de determinadas classes gramaticais em textos de diferentes gêneros.","Distinguir marcas de formalidade e informalidade em textos e suas situações comunicativas.","Estabelecer relações de sentido em textos verbais e/ou multimodais da cultura digital.","Reconhecer o efeito produzido pelo emprego de determinado tempo ou modo verbal em textos de diferentes gêneros.","Analisar a concordância verbal e/ou nominal em textos de diferentes gêneros.","Identificar o efeito de sentido promovido por recursos expressivos e/ou estilísticos em textos do campo artístico-literário.","Identificar características estruturais e/ou marcas linguísticas de textos do campo da vida cotidiana.","Analisar recursos argumentativos mobilizados em textos de diferentes gêneros com atenção à intencionalidade do enunciador.","Reconhecer elementos que indicam presença ou ausência de confiabilidade em textos do campo jornalístico-midiático.","Identificar características estruturais e/ou marcas linguísticas de textos do campo da vida pública.","Reconhecer as marcas linguísticas que evidenciam o tipo de citação, discurso e/ou referenciação em textos de diferentes gêneros.","Identificar relações lógico-discursivas entre orações em períodos compostos.","Identificar a tese, os argumentos e/ou os mecanismos de persuasão presentes em textos de diferentes gêneros.","Identificar a estrutura e/ou sentido de uma palavra a partir de seus processos de formação em língua portuguesa.","Identificar características estruturais e/ou marcas linguísticas de textos do campo das práticas de estudo e pesquisa.","Identificar os efeitos de sentido do uso de diferentes vozes verbais.","Analisar relações de intertextualidade e/ou interdiscurso entre diferentes textos.","Estabelecer relações entre partes do texto por meio de conjunções e articuladores textuais.","Analisar marcas de impessoalização e modalizadores discursivos em textos de diferentes gêneros.","Inferir o efeito de ironia, humor ou crítica em textos de diferentes gêneros.","Identificar aspectos do indivíduo, da sociedade e/ou do contexto da época em produções artístico-literárias.","Identificar características estilísticas de um movimento literário em produções artístico-literárias.","Identificar a função da linguagem predominante em um texto (referencial, conativa, emotiva, fática, poética, metalinguística).","Analisar a regência verbal e/ou nominal em textos de diferentes gêneros.","Analisar o efeito de sentido produzido pelo uso de determinadas classes gramaticais em textos de diferentes gêneros.","Analisar a construção argumentativa de textos com atenção à intencionalidade do autor.","Analisar a flexão das palavras (gênero, número e grau).","Analisar a funcionalidade sintática dos termos de uma oração.","Analisar características e/ou marcas linguisticas de diferentes gêneros textuais.","Analisar casos de colocação pronominal em diferentes situações comunicativas de uso.","Analisar o efeito de sentido produzido em um texto pelo uso de determinadas classes gramaticais (gênero, número, caso, aspecto morfológico, modo, voz, etc.).","Analisar o uso, a função e/ou efeito de sentido decorrente da pontuação e/ou outras notações em textos de dife    - HTML em vez de JSON: a implantação não está como "qualquer pessoa", e o

     direto do computador (file://) e o navegador barrou a chamada. */
let ultimaResposta="(ainda não houve resposta)";
async function resposta(r){
  const t=await r.text();
  ultimaResposta=(r.status+" "+r.statusText+"\n"+t).slice(0,1200);
  if(!r.ok) throw new Error("o servidor respondeu "+r.status);
  let j=null;
  try{ j=JSON.parse(t); }
  catch(e){
    throw new Error(/<html/i.test(t)
      ? "o Google pediu login: reveja 'quem pode acessar' na implantação"
      : "resposta não é JSON");
  }
  if(!j || j.ok!==true) throw new Error(j&&j.erro || "o script recusou");
  return j;
}

let enviando=false;
async function enviar(){
  if(!SINC || enviando || !fila.length) return;

  try{
    const lote=fila.slice(0,50);
    const r=await fetch(SINC.url,{method:"POST",
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify({segredo:SINC.segredo||"",registros:lote})});
    const j=await resposta(r);

    aviso("salvo às "+hora(),"ok");

    erro=true;
    aviso(fila.length+" por enviar — "+e.message,"erro");
  }finally{
    enviando=false;
    // deu certo e ainda há fila: manda o resto agora. Só espera quando
    // falhou, para não martelar um servidor que está fora do ar.
    if(fila.length) setTimeout(enviar, erro ? 4000 : 0);

}

   pelo script com item de outro descritor — isso trocaria uma decisão
   pedagógica por uma estatística. Ficam aqui, abertas, com duas listas ao
   lado: os itens do mesmo descritor e os da dificuldade pretendida em outros
   descritores. Quem escolhe é o analista. */
const kv = (c,a,dp,f,i,tp) => `${c}|${a}|VAGA|${dp}|${tp}|${f}|${i}`;
/* O grupo é o par descritor+tipo, não o descritor sozinho: o mesmo descritor
   pode ser pedido duas vezes no ano, uma como conexão (o MESMO item físico do
   ano de origem) e outra como etapa. São dois pedidos diferentes e não podem
   dividir o mesmo contador. */
const grupoDe = it => ((it.dp!==undefined&&it.dp!==null)?it.dp:it.d)
                      +"|"+(it.t==="conexao"?"conexao":"etapa");
function vagasDe(c,a,gk){
  const ped=(DADOS.pedido||{})[c+"|"+a+"|"+gk];
  if(!ped) return [];
  const tp=gk.split("|")[1];
  const cortes=cortesAno(c,a);
  const dados=DADOS.itens[c].filter(it=>it.an===a && grupoDe(it)===gk &&
    dec(c,a,it.c).st!=="recusado");
  const tem={facil:0,medio:0,dificil:0};
  for(const it of dados) tem[faixaDe(it,cortes[0],cortes[1])]++;
  const vagas=[];
  const nova=(f,i)=>vagas.push({f, tp, de:ped.de||a,
    // `de` é onde se procura o item que falta: o próprio ano, se for etapa;
    // o ano da conexão indicado pelo analista, se for conexão — item de
    // conexão só existe se já estiver na prova daquele ano
    k:kv(c,a,gk.split("|")[0],f,i,tp)});
  for(const [f,q] of [["facil",ped.f],["medio",ped.m],["dificil",ped.d]]){
    for(let i=tem[f]; i<(q||0); i++) nova(f,i);
  }
  /* Posições sem dificuldade pedida. Vários analistas não indicaram
     fácil/médio/difícil na conexão, e onde indicaram a conta não fechava com
     a quantidade: a dificuldade ali é escolha de quem valida, não do script.
     Essas vagas entram pela QUANTIDADE que falta, não por faixa. */
  const total=(ped.f||0)+(ped.m||0)+(ped.d||0)+(ped.livre||0);
  const faltam=total-dados.length-vagas.length;
  for(let i=0;i<faltam;i++) nova("livre",i);
  return vagas;
}
function itemEscolhido(chave){
  const d=decisoes[chave];
  if(!d || d.st!=="preenchida" || !d.por) return null;
  return porCod[comp][d.por] || null;
}

function provaDe(c,a){
  const out = [];
  for(const it of DADOS.itens[c]){
    if(it.an !== a) continue;
    const d = dec(c,a,it.c);
    if(d.st === "recusado") continue;
    if(d.st === "trocado" && d.por){
      const novo = porCod[c][d.por];
      if(novo){ out.push({...it, c:novo.c, a:novo.a, b:novo.b, cc:novo.cc,
                          f:novo.f, s:novo.s, v:novo.v, te:"", trocado:it.c});
                continue; }
    }
    out.push(it);
  }
  // itens que o analista escolheu para vagas que estavam em aberto
  for(const [chave,d] of Object.entries(decisoes)){
    if(d.st!=="preenchida" || !d.por) continue;
    const p=chave.split("|");
    if(p[0]!==c || p[1]!==a || p[2]!=="VAGA") continue;
    const novo=porCod[c][d.por];
    if(novo) out.push({...novo, an:a, t:"etapa", dp:+p[3], te:"", preenchida:chave});
  }
  return out;
}
const media = xs => xs.length ? xs.reduce((s,x)=>s+x,0)/xs.length : 0;
const dp = xs => { if(xs.length<2) return 0; const m=media(xs);
  return Math.sqrt(xs.reduce((s,x)=>s+(x-m)**2,0)/(xs.length-1)); };
/* Fácil/médio/difícil pela chance de acerto do estudante mediano do ano, não
   por tercil. O tercil descreve a prova montada, não o item: numa prova toda
   fácil ele rotula 1/3 de "difícil" assim mesmo, e não permite comparar anos —
   que é justamente o que a escala única deveria permitir. */
const D_LOG = 1.702;
/* Fácil, médio e difícil pelos tercis de b dos itens daquele ano. É quota de
   montagem, não afirmação sobre o item: a escala é progressiva, então difícil
   no 3EF não é difícil no 3EM. */
function tercis(lista){
  const bs=lista.map(i=>i.b).sort((x,y)=>x-y);
  if(bs.length<3) return [-0.5,0.5];
  return [bs[Math.floor(bs.length/3)], bs[Math.floor(2*bs.length/3)]];
}
/* Os cortes do ano-componente vêm dos itens DAQUELE ano no banco inteiro, não
   dos 80 que entraram na prova. São eles que julgam qualquer item da prova,
   inclusive os emprestados de outro ano. */
function cortesAno(c,a){
  const v=(DADOS.cortes_ano||{})[c+"|"+a];
  return v ? v : tercis(provaDe(c,a));
}
/* O mesmo critério do a8 (faixa_do_item), inclusive na borda: o item que cai
   exatamente em cima do corte fica na faixa de baixo. Com `>=` aqui, o índice
   contava como difícil o item que a planilha contava como médio, e o cabeçalho
   do grupo anunciava uma vaga em aberto que não existia. */
const faixaDe=(it,c1,c2)=> it.fx ? it.fx
  : (it.b<c1?"facil":(it.b>c2?"dificil":"medio"));
const theta = (c,a) => DADOS.theta[c+"|"+a];
const cortesDe = (c,a) => DADOS.cortes[c+"|"+a];
const corteProprio = (c,a) => !!DADOS.tem_corte_proprio[c+"|"+a];
/* Onde o item cai na escala de reporte: o ponto em que a chance de acerto é
   0,65. É a convenção do SAEB, e é o que transforma "este item mede o N3" numa
   frase verificável. Não depende de como o pré-teste correu — ao contrário da
   média de habilidade, que o baixo engajamento deprime. */

/* ------------------------------------------------------------------- gráfico */
const dica = $("#dica");
function comDica(node, texto){
  node.addEventListener("pointerenter", e=>{ dica.textContent = texto;
    dica.style.opacity = 1; mover(e); });
  node.addEventListener("pointermove", mover);
  node.addEventListener("pointerleave", ()=>{ dica.style.opacity = 0; });
  function mover(e){
    const x = Math.min(e.clientX+13, innerWidth-dica.offsetWidth-8);
    dica.style.left = x+"px";
    dica.style.top = Math.max(6, e.clientY-dica.offsetHeight-10)+"px";
  }
}
const COR = {etapa:"var(--etapa)", conexao:"var(--conexao)",
             substituto:"var(--subst)"};

function eixos(g,{x0,x1,y0,y1,L,T,W,H,rotX,rotY,tx,ty,passoX,passoY}){
  const sx = v => L + (v-x0)/(x1-x0)*W, sy = v => T + H - (v-y0)/(y1-y0)*H;
  for(let v=Math.ceil(x0/passoX)*passoX; v<=x1+1e-9; v+=passoX){
    g.append(el("line",{x1:sx(v),x2:sx(v),y1:T,y2:T+H,stroke:"var(--linha)",
      "stroke-width":1}));
    g.append(el("text",{x:sx(v),y:T+H+15,"text-anchor":"middle",
      fill:"var(--txt3)","font-size":10,"font-family":"var(--mono)"},
      (rotX||(n=>n))(v)));
  }
  for(let v=Math.ceil(y0/passoY)*passoY; v<=y1+1e-9; v+=passoY){
    g.append(el("line",{x1:L,x2:L+W,y1:sy(v),y2:sy(v),stroke:"var(--linha)",
      "stroke-width":1}));
    g.append(el("text",{x:L-7,y:sy(v)+3.5,"text-anchor":"end",
      fill:"var(--txt3)","font-size":10,"font-family":"var(--mono)"},
      (rotY||(n=>n))(v)));
  }
  if(tx) g.append(el("text",{x:L+W/2,y:T+H+34,"text-anchor":"middle",
    fill:"var(--txt3)","font-size":11},tx));
  if(ty) g.append(el("text",{x:11,y:T+H/2,"text-anchor":"middle",
    fill:"var(--txt3)","font-size":11,
    transform:`rotate(-90 11 ${T+H/2})`},ty));
  return {sx,sy};
}
function svgEl(w,h){
  // largura fluida, altura pelo viewBox: sem isso o gráfico estica no
  // desktop e some no telefone
  return el("svg",{viewBox:`0 0 ${w} ${h}`,
                   preserveAspectRatio:"xMidYMid meet",
                   style:`width:100%;height:auto;min-width:${Math.min(w,620)}px;`
                        +`max-height:${Math.round(h*1.25)}px`});
}
/* -------------------------------------------------------- dispersão a  x  b */
let eixoFixo = true;
function dispersao(lista){
  const W=760,H=340,L=58,T=14,PW=W-L-18,PH=H-T-50;
  const bs=lista.map(i=>i.b), as=lista.map(i=>i.a);
  let x0=-4,x1=4,y0=0,y1=3;
  if(!eixoFixo && lista.length){
    x0=Math.min(...bs)-.4; x1=Math.max(...bs)+.4;
    y0=Math.max(0,Math.min(...as)-.2); y1=Math.max(...as)+.2;
  }
  const s=svgEl(W,H), g=el("g");
  s.append(g);
  const {sx,sy}=eixos(g,{x0,x1,y0,y1,L,T,W:PW,H:PH,passoX:1,passoY:.5,
    rotX:v=>f2(v).replace("+0.00","0"),rotY:v=>v.toFixed(1),
    tx:"dificuldade  b",ty:"discriminação  a"});
  // faixas de tercil do próprio ano
  const [c1,c2]=cortesAno(comp,ano);
  const cont={facil:0,medio:0,dificil:0};
  for(const it of lista) cont[faixaDe(it,c1,c2)]++;
  for(const [lo,hi,rot,qt] of [[x0,c1,"fácil",cont.facil],
                               [c1,c2,"médio",cont.medio],
                               [c2,x1,"difícil",cont.dificil]]){
    if(hi<=lo) continue;
    g.append(el("rect",{x:sx(lo),y:T,width:Math.max(0,sx(hi)-sx(lo)),height:PH,
      fill:"var(--txt)","fill-opacity":rot==="médio"?0.05:0.018}));
    const dentro=bs.filter(v=>v>=lo&&v<hi);
    if(!dentro.length) continue;
    const meio=(Math.min(...dentro)+Math.max(...dentro))/2;
    g.append(el("text",{x:sx(meio),y:T+12,"text-anchor":"middle",
      fill:"var(--txt3)","font-size":10},`${rot} · ${qt}`));
  }
  for(const corte of [c1,c2]){
    g.append(el("line",{x1:sx(corte),x2:sx(corte),y1:T,y2:T+PH,
      stroke:"var(--txt3)","stroke-width":1,"stroke-dasharray":"3 3"}));
    g.append(el("text",{x:sx(corte)+3,y:T+PH-5,"text-anchor":"start",
      fill:"var(--txt3)","font-size":9.5,"font-family":"var(--mono)"},f2(corte)));
  }
  g.append(el("line",{x1:L,x2:L+PW,y1:sy(0.5),y2:sy(0.5),stroke:"var(--erro)",
    "stroke-width":1.5,"stroke-dasharray":"4 3"}));
  g.append(el("text",{x:L+PW,y:sy(0.5)-5,"text-anchor":"end",fill:"var(--erro)",
    "font-size":10},"a = 0,50"));
  for(const it of lista){
    if(it.b<x0||it.b>x1||it.a<y0||it.a>y1) continue;
    const c=el("circle",{cx:sx(it.b),cy:sy(it.a),r:it.t==="conexao"?5.5:4.5,
      fill:COR[it.t],"fill-opacity":.85,stroke:"var(--surface)",
      "stroke-width":1.5});
    comDica(c, `${it.c}\n${DADOS.descritores[it.d]}\na ${it.a.toFixed(2)} · `+
      `b ${f2(it.b)}\n`+
      `${faixaDe(it,c1,c2)}\n`+
      `${it.t}${it.ai&&it.ai!==ano?" · item do "+it.ai:""}`+
      `${it.te?" · também em "+it.te:""}`);
    g.append(c);
  }
  const leg=el("div",{class:"legenda"},
    el("span",{},el("i",{class:"pt",style:"background:var(--etapa)"}),"etapa"),
    el("span",{},el("i",{class:"pt",style:"background:var(--conexao)"}),"conexão entre anos"),
    el("span",{},el("i",{class:"pt",style:"background:var(--subst)"}),
      "item que o analista trouxe para uma vaga"),
    el("span",{},`tracejado = cortes do ${ano}, dos itens desse ano no banco`),
    el("span",{},el("button",{class:"btn",style:"padding:2px 8px",
      onclick:()=>{eixoFixo=!eixoFixo;desenhar();}},
      eixoFixo?"eixo fixo (−4 a 4)":"eixo ajustado aos dados")));
  return el("div",{},el("div",{class:"rolagem"},s),leg);
}

/* ------------------------------------------------------------- histograma b */
/* `op` deixa os dez anos saírem na MESMA escala de x e de y: sem isso cada
   histograma se ajusta aos próprios dados e dois anos lado a lado não se
   comparam, que é justamente para o que esta aba serve. Os cortes são
   desenhados DEPOIS das barras, para ficarem à frente delas. */
function histograma(lista, op={}){
  const W=op.W||760, H=op.H||215, L=40,T=12,PW=W-L-18,PH=H-T-44, passo=.5;
  const bins={};
  for(const it of lista){const k=Math.floor(it.b/passo)*passo;
    bins[k]=(bins[k]||0)+1;}
  const ks=Object.keys(bins).map(Number).sort((a,b)=>a-b);
  if(!ks.length && op.x0===undefined) return el("p",{class:"vazio"},"sem itens");
  const x0=op.x0!==undefined?op.x0:Math.min(...ks);
  const x1=op.x1!==undefined?op.x1:Math.max(...ks)+passo;
  const y1=op.y1||Math.max(1,...Object.values(bins));
  const s=svgEl(W,H),g=el("g"); s.append(g);
  // passoX em unidades de b: estava 50, herdado de um gráfico de escala, e só
  // o zero caía dentro do intervalo — os dez histogramas saíam sem marcação
  const {sx,sy}=eixos(g,{x0,x1,y0:0,y1,L,T,W:PW,H:PH,passoX:1,
    passoY:Math.max(1,Math.ceil(y1/4)),
    rotX:v=>f2(v).replace("+0.00","0"),
    rotY:v=>String(v),tx:op.tx!==undefined?op.tx:"dificuldade  b",ty:"itens"});
  const lg=sx(x0+passo)-sx(x0);
  for(const k of ks){
    if(k<x0||k>=x1) continue;
    const h=PH-(sy(bins[k])-T);
    const r=el("rect",{x:sx(k)+1,y:sy(bins[k]),width:Math.max(1,lg-2),
      height:Math.max(0,h),fill:op.cor||"var(--etapa)",rx:3});
    comDica(r,`b de ${f2(k)} a ${f2(k+passo)}\n${bins[k]} itens`);
    g.append(r);
  }
  for(const corte of (op.cortes||cortesAno(comp,ano))){
    if(corte<x0||corte>x1) continue;
    g.append(el("line",{x1:sx(corte),x2:sx(corte),y1:T,y2:T+PH,
      stroke:"var(--txt)","stroke-width":1.5}));
    g.append(el("text",{x:sx(corte),y:T+9,"text-anchor":"middle",
      fill:"var(--txt)","font-size":9.5,"font-family":"var(--mono)",
      stroke:"var(--surface)","stroke-width":3,"paint-order":"stroke"},
      f2(corte)));
  }
  return el("div",{class:"rolagem"},s);
}

/* --------------------------------------------- progressão da escala por ano */
function progressao(){
  /* A progressão da escala: dificuldade média da prova de cada ano, nos dois
     componentes. É aqui que se vê se a prova do ano seguinte é de fato mais
     difícil que a do anterior — o que uma escala vertical exige. */
  const W=760,H=330,L=62,T=16,PW=W-L-18,PH=H-T-48;
  const series={};
  for(const c of ["LP","MT"]) series[c]=DADOS.anos.map(a=>{
    const bs=provaDe(c,a).map(i=>i.b);
    return {a, m:media(bs), s:dp(bs), n:bs.length};});
  const todos=[].concat(...Object.values(series));
  const y0=Math.min(...todos.map(d=>d.m))-.3;
  const y1=Math.max(...todos.map(d=>d.m))+.3;
  const s2=svgEl(W,H),g=el("g"); s2.append(g);
  const px=i=>L+(i+.5)/DADOS.anos.length*PW;
  const sy=v=>T+PH-(v-y0)/(y1-y0)*PH;
  for(let v=Math.ceil(y0*2)/2; v<=y1; v+=.5){
    g.append(el("line",{x1:L,x2:L+PW,y1:sy(v),y2:sy(v),stroke:"var(--linha)"}));
    g.append(el("text",{x:L-7,y:sy(v)+3.5,"text-anchor":"end",fill:"var(--txt3)",
      "font-size":10,"font-family":"var(--mono)"},f2(v)));
  }
  DADOS.anos.forEach((a,i)=>g.append(el("text",{x:px(i),y:T+PH+16,
    "text-anchor":"middle",fill:"var(--txt3)","font-size":10,
    "font-family":"var(--mono)"},a)));
  g.append(el("text",{x:12,y:T+PH/2,"text-anchor":"middle",fill:"var(--txt3)",
    "font-size":11,transform:`rotate(-90 12 ${T+PH/2})`},"dificuldade média  b"));
  for(const [c,cor] of [["LP","var(--etapa)"],["MT","var(--conexao)"]]){
    const d=series[c];
    g.append(el("polyline",{points:d.map((p,i)=>`${px(i)},${sy(p.m)}`).join(" "),
      fill:"none",stroke:cor,"stroke-width":2,"stroke-linejoin":"round"}));
    d.forEach((p,i)=>{
      const o=el("circle",{cx:px(i),cy:sy(p.m),r:4,fill:cor,
        stroke:"var(--surface)","stroke-width":2});
      comDica(o,`${c} ${p.a}\nb médio ${f2(p.m)} · dp ${p.s.toFixed(2)}\n`+
        `${p.n} itens`);
      g.append(o);
    });
    g.append(el("text",{x:px(d.length-1)+8,y:sy(d[d.length-1].m)+4,fill:cor,
      "font-size":11,"font-weight":600},c));
  }
  return el("div",{},
    el("div",{class:"rolagem"},s2),
    el("div",{class:"legenda"},
      el("span",{},el("i",{class:"pt",style:"background:var(--etapa)"}),
        "Língua Portuguesa"),
      el("span",{},el("i",{class:"pt",style:"background:var(--conexao)"}),
        "Matemática"),
      el("span",{},"cada ponto é a dificuldade média da prova do ano")));
}

/* ------------------------------------------------------- strip de descritores */
function descritores(lista){
  const grupos={};
  for(const it of lista)(grupos[it.d]=grupos[it.d]||[]).push(it);
  const ks=Object.keys(grupos).map(Number)
    .sort((x,y)=>media(grupos[x].map(i=>i.b))-media(grupos[y].map(i=>i.b)));
  // L largo de propósito: os rótulos dos descritores saem girados a -45° e,
  // com margem curta, o primeiro deles era cortado pela borda do gráfico
  const W=Math.max(760,ks.length*26+170),H=360,L=118,T=14,PW=W-L-18,PH=H-T-120;
  const bs=lista.map(i=>i.b);
  const y0=Math.min(...bs)-.3,y1=Math.max(...bs)+.3;
  const s=svgEl(W,H),g=el("g"); s.append(g);
  const px=i=>L+(i+.5)/ks.length*PW, sy=v=>T+PH-(v-y0)/(y1-y0)*PH;
  for(let v=Math.ceil(y0);v<=y1;v+=1){
    g.append(el("line",{x1:L,x2:L+PW,y1:sy(v),y2:sy(v),stroke:"var(--linha)"}));
    g.append(el("text",{x:L-7,y:sy(v)+3.5,"text-anchor":"end",fill:"var(--txt3)",
      "font-size":10,"font-family":"var(--mono)"},f2(v)));
  }
  g.append(el("text",{x:12,y:T+PH/2,"text-anchor":"middle",fill:"var(--txt3)",
    "font-size":11,transform:`rotate(-90 12 ${T+PH/2})`},"dificuldade  b"));
  ks.forEach((k,i)=>{
    const its=grupos[k], m=media(its.map(o=>o.b));
    g.append(el("line",{x1:px(i),x2:px(i),y1:sy(Math.min(...its.map(o=>o.b))),
      y2:sy(Math.max(...its.map(o=>o.b))),stroke:"var(--linha)","stroke-width":2}));
    for(const it of its){
      const c=el("circle",{cx:px(i),cy:sy(it.b),r:4,fill:COR[it.t],
        "fill-opacity":.85,stroke:"var(--surface)","stroke-width":1.5});
      comDica(c,`${it.c}\n${DADOS.descritores[it.d]}\nb ${f2(it.b)} · a ${it.a.toFixed(2)}`);
      g.append(c);
    }
    g.append(el("line",{x1:px(i)-7,x2:px(i)+7,y1:sy(m),y2:sy(m),
      stroke:"var(--txt)","stroke-width":2}));
    const t=el("text",{x:px(i),y:T+PH+12,"text-anchor":"end",fill:"var(--txt3)",
      "font-size":9.5,transform:`rotate(-45 ${px(i)} ${T+PH+12})`},
      DADOS.descritores[k].slice(0,26)+(DADOS.descritores[k].length>26?"…":""));
    comDica(t,DADOS.descritores[k]+`\n${its.length} itens · b médio ${f2(m)}`);
    g.append(t);
  });
  return el("div",{},el("div",{class:"rolagem"},s),
    el("div",{class:"legenda"},
      el("span",{},"traço preto = b médio do descritor · descritores ordenados do mais fácil ao mais difícil")));
}

/* --------------------------------------------------------- lista de validação */
function linhaItem(it){
  const d=dec(comp,ano,it.c);
  const alvo=d.st==="trocado"&&d.por?porCod[comp][d.por]:null;
  const mostra=alvo||it;
  const caixa=el("div",{class:"item "+(d.st==="recusado"?"recusado":
    d.st==="aprovado"?"aprovado":"")});
  juntar(caixa,
    el("span",{class:"cod"},mostra.c,
      alvo?el("span",{class:"chip substituto",style:"margin-left:6px"},
        "entrou no lugar de "+it.c):null),
    el("span",{class:"nums"},`a ${mostra.a.toFixed(2)}  b ${f2(mostra.b)}  c ${mostra.cc.toFixed(2)}`),
    el("span",{class:"chip "+it.t},it.t),
    el("span",{class:"chip"},mostra.f),
    (mostra.ai&&mostra.ai!==ano)
      ? el("span",{class:"chip fora",title:
          "o item foi escrito para o "+mostra.ai+", não para o "+ano},
          "item do "+mostra.ai):null,
    it.te?el("span",{class:"chip"},"também em "+it.te):null);
  const [tc1,tc2]=cortesAno(comp,ano);
  const fx=faixaDe(mostra,tc1,tc2);
  caixa.append(el("span",{class:"chip f"+fx,
    title:`tercis de b do ${ano}: ${f2(tc1)} e ${f2(tc2)}`},fx));
  // a faixa dentro do próprio descritor, que é a régua com que a demanda dos
  // analistas foi atendida; só aparece quando discorda da régua do ano
  // o que teve de ceder para este item entrar: primeiro o ano, depois o
  // descritor; a dificuldade pedida só cede em último caso
  // o ano de origem já tem etiqueta própria ("item do 9EF"), então não se
  // repete aqui; só sobra avisar quando a DIFICULDADE pedida não foi a que
  // entrou
  if(it.ced==="sem a dificuldade pedida")
    caixa.append(el("span",{class:"chip fora",
      title:"o descritor não tinha item na dificuldade que os analistas "+
            "pediram; entrou outro item do mesmo descritor"},
      "fora da dificuldade pedida"));
  const acoes=el("div",{class:"acoes"});
  if(mostra.lk) acoes.append(el("a",{class:"ver",href:urlItem(mostra.lk),
    target:"_blank",rel:"noopener",title:"abre a versão diagramada do item"},
    "ver item"));
  const bOk=el("button",{"aria-pressed":d.st==="aprovado",
    onclick:()=>{marcar(it.c,d.st==="aprovado"?"pendente":"aprovado");}},"aprovar");
  const bNao=el("button",{class:"nao","aria-pressed":d.st==="recusado"||d.st==="trocado",
    onclick:()=>{caixa.parentElement.querySelectorAll(".troca").forEach(x=>x.remove());
      abrirTroca(caixa,it);}},"trocar / recusar");
  acoes.append(bOk,bNao);
  caixa.append(acoes);
  return caixa;
}
function marcar(cod,st,por=""){
  const k=kd(comp,ano,cod);
  if(st==="pendente") delete decisoes[k];
  else decisoes[k]={st,por,nota:"",ts:Date.now()};
  salvar(k); desenhar();
}
function abrirVaga(caixa, vaga, dp){
  const [c1,c2]=cortesAno(comp,ano);
  const usados=new Set(provaDe(comp,ano).map(i=>i.c));
  const box=el("div",{class:"troca"});
  /* Lista 1: o mesmo descritor, de QUALQUER ano. A dificuldade de cada um é
     medida pelos cortes do ano da prova — item do 4EF que se cogita pôr no
     3EF é julgado pela régua do 3EF, não pela do 4EF. Quem está na
     dificuldade da vaga vem primeiro, mas a lista mostra todas as
     dificuldades: é o analista quem decide se vale trocar a dificuldade ou
     o descritor. */
  const ordemF={facil:0,medio:1,dificil:2};
  /* Conexão é outra busca. O item de conexão é o MESMO item físico que já
     está na prova do ano de origem — é isso que liga as duas escalas. Então
     não se procura no banco nem no ano que está sendo montado: procura-se
     na prova do ano que o analista indicou (6EF, para uma conexão 6EF→7EF).
     A dificuldade continua medida pelos cortes do ano da prova. */
  const conexao = vaga.tp==="conexao";
  const anoBusca = conexao ? (vaga.de||ano) : ano;
  const fonte = conexao
    ? provaDe(comp,anoBusca).map(x=>({...x, uso:`${comp} ${anoBusca}`}))
    : DADOS.alternativas[comp];
  const livre = vaga.f==="livre";   // dificuldade a escolher
  const mesmo=fonte
    .filter(x=>x.d===dp && !usados.has(x.c))
    .map(x=>({...x, fx:faixaDe(x,c1,c2)}))
    .sort((a,b)=>(livre?0:(a.fx===vaga.f?0:1)-(b.fx===vaga.f?0:1))
                 || ordemF[a.fx]-ordemF[b.fx] || a.b-b.b);
  /* Lista 2 só existe quando a 1 está vazia: enquanto houver item do
     descritor pedido, trocar de descritor não é a primeira saída. Para
     conexão, os outros descritores também saem da prova do ano de origem. */
  const outros=mesmo.length ? [] : fonte
    .filter(x=>x.d!==dp && !usados.has(x.c)
            && (conexao || (!x.uso && (!x.ai || x.ai===ano))))
    .map(x=>({...x, fx:faixaDe(x,c1,c2)}))
    .filter(x=>livre || x.fx===vaga.f)
    .sort((a,b)=>b.a-a.a).slice(0,20);
  const linha = (x,marcarDesc) => el("div",{class:"alt"},
    el("span",{class:"cod"},x.c,
      marcarDesc?el("span",{class:"chip",style:"margin-left:6px"},
        DADOS.descritores[x.d].slice(0,40)+"…"):null),
    el("span",{class:"nums"},`a ${x.a.toFixed(2)}  b ${f2(x.b)}  c ${(x.cc??0).toFixed(2)}`),
    el("span",{class:"chip f"+x.fx},x.fx),
    // de onde vem o item: banco já calibrado antes ou pré-teste deste ano
    el("span",{class:"chip"},x.f||"—"),
    (x.ai&&x.ai!==ano)?el("span",{class:"chip fora"},"item do "+x.ai):null,
    x.uso?el("span",{class:"chip fora"},"em uso em "+x.uso):null,
    x.lk?el("a",{class:"ver",href:urlItem(x.lk),target:"_blank",
      rel:"noopener"},"ver"):null,
    el("button",{class:"btn",style:"margin-left:auto;padding:3px 9px",
      onclick:()=>{decisoes[vaga.k]={st:"preenchida",por:x.c,nota:"",
                                     ts:Date.now()};
                   salvar(vaga.k); desenhar();}},"usar este"));
  box.append(el("h4",{}, conexao
    ? `itens deste descritor na prova do ${anoBusca} (${mesmo.length}) — `+
      `dificuldade pelos cortes do ${ano}`
    : `itens deste descritor, de qualquer ano (${mesmo.length}) — `+
      `dificuldade pelos cortes do ${ano}`));
  if(mesmo.length) mesmo.forEach(x=>box.append(linha(x,false)));
  else{
    box.append(el("p",{class:"vazio"}, conexao
      ? `a prova do ${anoBusca} não tem nenhum item deste descritor `+
        `disponível para a conexão`
      : "o banco não tem nenhum outro item utilizável deste descritor, "+
        "em nenhum ano"));
    box.append(el("h4",{style:"margin-top:12px"},
      `então, itens ${livre?"":vaga.f+" "}da prova do ${anoBusca} em outros `+
      `descritores (${outros.length}`+
      (outros.length>=20?", os 20 de maior discriminação":"")+")"));
    if(outros.length) outros.forEach(x=>box.append(linha(x,true)));
    else box.append(el("p",{class:"vazio"},
      `não há item ${livre?"":vaga.f+" "}disponível do ${anoBusca} em `+
      `nenhum outro descritor`));
  }
  /* Nenhuma das duas listas serve? O analista procura à mão, em TODO o banco
     do componente — qualquer descritor, qualquer ano. O item escolhido fecha
     esta vaga e passa a aparecer também na caixa do descritor dele, marcado
     como adicional. */
  box.append(el("h4",{style:"margin-top:12px"},
    "ou procure qualquer item do banco"));
  const busca=el("input",{class:"busca",type:"search",
    placeholder:"código do item ou parte do descritor…"});
  const res=el("div",{class:"resbusca"});
  const buscar=()=>{
    res.textContent="";
    const q=busca.value.trim().toLowerCase();
    if(q.length<2){
      res.append(el("p",{class:"vazio"},
        "digite ao menos dois caracteres"));
      return;
    }
    const achados=DADOS.alternativas[comp]
      .filter(x=>!usados.has(x.c) &&
        (x.c.toLowerCase().includes(q) ||
         (DADOS.descritores[x.d]||"").toLowerCase().includes(q)))
      .map(x=>({...x, fx:faixaDe(x,c1,c2),
                peso:x.c.toLowerCase().includes(q)?0:1}))
      .sort((a,b)=>a.peso-b.peso || a.c.localeCompare(b.c))
      .slice(0,12);
    if(!achados.length){
      res.append(el("p",{class:"vazio"},"nenhum item com esse código ou "+
        "descritor no banco de "+comp));
      return;
    }
    achados.forEach(x=>res.append(linha(x,true)));
    res.append(el("p",{class:"vazio"},
      "mostrando até 12; refine a busca se não achou"));
  };
  busca.addEventListener("input",buscar);
  box.append(busca,res);
  box.append(el("div",{class:"alt",style:"margin-top:8px"},
    el("button",{class:"btn",onclick:()=>{delete decisoes[vaga.k];
      salvar(vaga.k); desenhar();}},"deixar em aberto")));
  caixa.after(box);
  busca.focus();
}

function abrirTroca(caixa,it){
  const [tc1,tc2]=cortesAno(comp,ano);
  /* Substituto de item de conexão não sai do banco: tem de ser um item que
     JÁ ESTÁ na prova do ano de origem, senão a ligação entre os dois anos
     não existe. Para item de etapa, a lista continua sendo o banco. */
  const ehConexao = it.t==="conexao" && it.ai;
  const naProva = new Set(provaDe(comp,ano).map(x=>x.c));
  const livres = ehConexao
    ? provaDe(comp,it.ai).filter(x=>x.d===it.d && !naProva.has(x.c))
        .map(x=>({...x, uso:""}))
    : DADOS.alternativas[comp].filter(x=>x.d===it.d&&!x.uso);
  const usados = ehConexao
    ? []
    : DADOS.alternativas[comp].filter(x=>x.d===it.d&&x.uso);
  const box=el("div",{class:"troca"});
  /* Item de conexão é o MESMO item físico nas provas de dois anos. Recusá-lo
     aqui não mexe só nesta prova: desfaz a ligação entre os dois anos, que é
     o que permite pôr as duas na mesma escala. Nove pessoas validando anos
     diferentes não têm como saber disso sozinhas — então o aviso vem antes
     das opções, não depois. */
  const ligacoes=(it.te||"").split(",").map(x=>x.trim()).filter(Boolean);
  if(it.t==="conexao" || ligacoes.length)
    box.append(el("p",{class:"vazio",style:"color:var(--alerta)"},
      it.t==="conexao"
        ? `Este é um item de conexão: ele é o mesmo item físico que está na `+
          `prova do ${it.ai}. Recusar aqui quebra a ligação entre ${it.ai} e `+
          `${ano} — se for para recusar, o item precisa sair dos dois anos, e `+
          `o ${ano} precisa de outro item de conexão no lugar.`
        : `Este item também está na prova de ${ligacoes.join(", ")}. Trocar `+
          `aqui não muda o outro ano; rever os dois é com vocês.`));
  box.append(el("h4",{}, ehConexao
    ? `substituir por outro item deste descritor na prova do ${it.ai}`
    : "substituir por um item do mesmo descritor"));
  if(!livres.length&&!usados.length)
    box.append(el("p",{class:"vazio"}, ehConexao
      ? `A prova do ${it.ai} não tem outro item deste descritor para servir `+
        `de conexão. Recusar aqui deixa a prova com um item a menos.`
      : "O banco não tem nenhum outro item utilizável deste descritor. "+
        "Recusar aqui deixa a prova com um item a menos."));
  for(const alt of livres.slice(0,12))
    box.append(el("div",{class:"alt"},
      el("span",{class:"cod"},alt.c),
      el("span",{class:"nums"},`a ${alt.a.toFixed(2)}  b ${f2(alt.b)}  c ${(alt.cc??0).toFixed(2)}`),
      el("span",{class:"chip"},alt.f),
      (alt.ai&&alt.ai!==ano)?el("span",{class:"chip fora"},
        "item do "+alt.ai):null,
      el("span",{class:"chip f"+faixaDe(alt,tc1,tc2)},faixaDe(alt,tc1,tc2)),
      alt.lk?el("a",{class:"ver",href:urlItem(alt.lk),target:"_blank",rel:"noopener"},
        "ver"):null,
      el("button",{class:"btn",style:"margin-left:auto;padding:3px 9px",
        onclick:()=>marcar(it.c,"trocado",alt.c)},"usar este")));
  if(usados.length)
    box.append(el("p",{class:"vazio",style:"margin-top:8px"},
      usados.length+" outro(s) item(ns) deste descritor existem, mas já estão "+
      "na prova de outro ano ("+[...new Set(usados.map(u=>u.uso))].join(", ")+
      "). Trocar por um deles implica rever os dois anos."));
  box.append(el("div",{class:"alt",style:"margin-top:8px"},
    el("button",{class:"btn",onclick:()=>marcar(it.c,"recusado")},
      "recusar sem substituir"),
    el("button",{class:"btn",onclick:()=>marcar(it.c,"pendente")},
      "cancelar")));
  caixa.after(box);
}

function abaProva(){
  const lista=provaDe(comp,ano);
  const plan=DADOS.desenho[ano];
  const orig=DADOS.itens[comp].filter(i=>i.an===ano);
  const revisados=orig.filter(i=>dec(comp,ano,i.c).st!=="pendente").length;
  const [k1,k2]=cortesAno(comp,ano);
  const cont={facil:0,medio:0,dificil:0};
  for(const it of lista) cont[faixaDe(it,k1,k2)]++;
  const tiles=el("div",{class:"tiles"},
    tile(lista.length, `itens na prova (desenho: ${plan.tb*plan.nb})`,
      lista.length!==plan.tb*plan.nb),
    tile(plan.caderno, `itens por caderno · ${plan.nb} blocos de ${plan.tb}`),
    tile(lista.filter(i=>i.t==="conexao").length,"itens de conexão",
      lista.filter(i=>i.t==="conexao").length<12&&ano!==DADOS.anos[0]),
    tile(media(lista.map(i=>i.a)).toFixed(2),"discriminação média"),
    tile(f2(media(lista.map(i=>i.b))),"dificuldade média"),
    tile(`${cont.facil}·${cont.medio}·${cont.dificil}`,
      `fácil · médio · difícil (cortes do ${ano}: b ${f2(k1)} e ${f2(k2)})`),
    tile(`${revisados}/${orig.length}`,"itens já revisados",
      revisados<orig.length));
  // agrupa pela VAGA que o analista pediu (dp), não pelo descritor do item:
  // é o pedido dele que está sendo validado
  const grupos={};
  for(const it of orig){const k=grupoDe(it); (grupos[k]=grupos[k]||[]).push(it);}
  /* Descritor que o banco não cobriu em nada não tem item nenhum, logo não
     entraria aqui — e é justamente o que o analista mais precisa ver. O grupo
     nasce do PEDIDO, não dos itens: fica vazio, com as vagas abertas. */
  for(const chave of Object.keys(DADOS.pedido||{})){
    const [c,a,...resto]=chave.split("|");
    if(c!==comp || a!==ano) continue;
    const k=resto.join("|");
    if(!grupos[k]) grupos[k]=[];
  }
  const [tc1g,tc2g]=cortesAno(comp,ano);
  /* Item que o analista trouxe de outro descritor para fechar uma vaga:
     além de aparecer na vaga, ele entra na caixa do descritor DELE, marcado
     como adicional. Se esse descritor não foi pedido neste ano, a caixa é
     criada só para mostrá-lo — senão o item sumiria da leitura por
     descritor, que é como o analista confere a prova. */
  const adicionais={};
  for(const [chave,d] of Object.entries(decisoes)){
    if(d.st!=="preenchida" || !d.por) continue;
    const q=chave.split("|");
    if(q[0]!==comp || q[1]!==ano || q[2]!=="VAGA") continue;
    const x=porCod[comp][d.por];
    if(!x || x.d===+q[3]) continue;          // a vaga é do próprio descritor
    const alvoK=grupos[x.d+"|etapa"] ? x.d+"|etapa"
              : grupos[x.d+"|conexao"] ? x.d+"|conexao"
              : x.d+"|etapa";
    if(!grupos[alvoK]) grupos[alvoK]=[];
    (adicionais[alvoK]=adicionais[alvoK]||[]).push({x, vaga:+q[3], faixa:q[5]});
  }
  const mb=k=>grupos[k].length?media(grupos[k].map(i=>i.b)):Infinity;
  const ordem=Object.keys(grupos).sort((x,y)=>mb(x)-mb(y));
  const corpo=el("div",{});
  for(const k of ordem){
    const its=grupos[k];
    const kd=+k.split("|")[0], ktp=k.split("|")[1];
    const g=el("details",{class:"grupo",open:its.length<=3?"":null});
    // o que foi pedido para esta vaga, contra o que a prova entregou
    const ped=(DADOS.pedido||{})[comp+"|"+ano+"|"+k];
    const viv=its.filter(i=>dec(comp,ano,i.c).st!=="recusado");
    const ent={facil:0,medio:0,dificil:0};
    for(const i of viv) ent[faixaDe(i,tc1g,tc2g)]++;
    // o que falta vai no mesmo formato do pedido e do entregue: 1F 0M 1D
    const falta=ped?{facil:Math.max(0,(ped.f||0)-ent.facil),
                     medio:Math.max(0,(ped.m||0)-ent.medio),
                     dificil:Math.max(0,(ped.d||0)-ent.dificil)}
                  :{facil:0,medio:0,dificil:0};
    // posições livres: contam na quantidade, não numa faixa
    const nLivre=ped?(ped.livre||0):0;
    const pedTotal=ped?((ped.f||0)+(ped.m||0)+(ped.d||0)+nLivre):0;
    const faltaQtd=ped?Math.max(0,pedTotal-viv.length):0;
    const temFalta=falta.facil+falta.medio+falta.dificil>0 || faltaQtd>0;
    let linhaPed=null, linhaMapa=null;
    if(ped){
      const pedTxt=(ped.f||ped.m||ped.d)
        ? `${ped.f}F ${ped.m}M ${ped.d}D`+(nLivre?` + ${nLivre} a escolher`:"")
        : `${nLivre} ite${nLivre===1?"m":"ns"}, dificuldade a escolher`;
      const faltaTxt=(falta.facil+falta.medio+falta.dificil)
        ? `${falta.facil}F ${falta.medio}M ${falta.dificil}D`
        : `${faltaQtd} ite${faltaQtd===1?"m":"ns"}`;
      linhaPed=el("div",{class:"gmeta"},
        `pedido ${pedTxt} · entregue `+
        `${ent.facil}F ${ent.medio}M ${ent.dificil}D`+
        (temFalta?` — falta ${faltaTxt}`:" ✓"));
      if(temFalta) linhaPed.style.color="var(--alerta)";
      /* Quando a indicação do mapa não soma a quantidade da própria linha,
         a quantidade manda (é ela que fecha as posições do desenho) e a
         indicação é reescalada. O aviso fica aqui para o mapa ser
         corrigido na origem. */
      const m=ped.mapa;
      if(m && m[3] && m[0]+m[1]+m[2]!==m[3] && !nLivre)
        linhaMapa=el("div",{class:"gmeta aviso"},
          `o mapa pede ${m[3]} ite${m[3]===1?"m":"ns"} e indica `+
          `${m[0]}F ${m[1]}M ${m[2]}D (${m[0]+m[1]+m[2]}) — `+
          `a indicação foi reescalada para a quantidade`);
    }
    if(ped && temFalta) g.className="grupo pend";
    g.append(el("summary",{},
      el("span",{class:"gtxt"},
        el("b",{},DADOS.descritores[kd]),
        ktp==="conexao"
          ? el("span",{class:"chip conexao",style:"margin-left:6px"},"conexão")
          : null,
        linhaPed, linhaMapa,
        el("div",{class:"gmeta"}, its.length
          ? `${its.length} ${its.length===1?"item":"itens"} · b médio `+
            `${f2(media(its.map(i=>i.b)))} · a médio `+
            `${media(its.map(i=>i.a)).toFixed(2)}`
          : ped ? "nenhum item: o banco não cobriu este descritor"
                : "descritor fora do pedido deste ano")),
      el("span",{class:"sel"},
        its.filter(i=>dec(comp,ano,i.c).st!=="pendente").length+"/"+its.length)));
    for(const it of its) g.append(linhaItem(it));
    for(const vaga of vagasDe(comp,ano,k)){
      const esc=itemEscolhido(vaga.k);
      const linha=el("div",{class:"item"+(esc?" aprovado":"")});
      if(esc){
        linha.append(
          el("span",{class:"cod"},esc.c,
            el("span",{class:"chip f"+vaga.f,style:"margin-left:6px"},
              vaga.f==="livre" ? "escolhido para a vaga"
                               : "escolhido para a vaga "+vaga.f)),
          el("span",{class:"nums"},`a ${esc.a.toFixed(2)}  b ${f2(esc.b)}  c ${(esc.cc??0).toFixed(2)}`),
          // a faixa real do item: quando difere da vaga, o analista vê que
          // trocou a dificuldade de propósito
          el("span",{class:"chip f"+faixaDe(esc,tc1g,tc2g)},
            faixaDe(esc,tc1g,tc2g)),
          el("span",{class:"chip"},esc.f||"—"),
          (esc.ai&&esc.ai!==ano)?el("span",{class:"chip fora"},
            "item do "+esc.ai):null,
          (esc.d!==kd)?el("span",{class:"chip fora",
            title:DADOS.descritores[esc.d]},"outro descritor"):null);
      }else{
        linha.append(
          el("span",{class:"cod",style:"color:var(--alerta)"},
            "vaga em aberto"),
          el("span",{class:"chip f"+vaga.f},
            vaga.f==="livre"?"dificuldade a escolher":vaga.f),
          el("span",{class:"nums",style:"color:var(--txt3)"},
            vaga.f==="livre"
              ? (vaga.tp==="conexao"
                  ? `a prova do ${vaga.de} não tem mais item deste descritor `+
                    `para a conexão`
                  : `o ${ano} não tem mais item deste descritor`)
              : vaga.tp==="conexao"
                  ? `a prova do ${vaga.de} não tem item ${vaga.f} deste `+
                    `descritor para a conexão`
                  : `o ${ano} não tem item ${vaga.f} deste descritor`));
      }
      const ac=el("div",{class:"acoes"});
      ac.append(el("button",{onclick:()=>{
        linha.parentElement.querySelectorAll(".troca").forEach(x=>x.remove());
        abrirVaga(linha,vaga,kd);}}, esc?"trocar":"escolher item"));
      linha.append(ac);
      g.append(linha);
    }
    for(const ad of (adicionais[k]||[])){
      const x=ad.x;
      g.append(el("div",{class:"item adicional"},
        el("span",{class:"cod"},x.c),
        el("span",{class:"nums"},
          `a ${x.a.toFixed(2)}  b ${f2(x.b)}  c ${(x.cc??0).toFixed(2)}`),
        el("span",{class:"chip f"+faixaDe(x,tc1g,tc2g)},
          faixaDe(x,tc1g,tc2g)),
        el("span",{class:"chip"},x.f||"—"),
        (x.ai&&x.ai!==ano)?el("span",{class:"chip fora"},
          "item do "+x.ai):null,
        el("span",{class:"chip substituto",
          title:"este item é deste descritor, mas foi escolhido para fechar "+
                "uma vaga de: "+DADOS.descritores[ad.vaga]},
          "adicional · fecha vaga "+(ad.faixa==="livre"?"":ad.faixa+" ")+"de "+
          DADOS.descritores[ad.vaga].slice(0,34)+"…"),
        x.lk?el("a",{class:"ver",href:urlItem(x.lk),target:"_blank",
          rel:"noopener"},"ver item"):null));
    }
    corpo.append(g);
  }
  return el("div",{},tiles,
    el("div",{class:"cartao"},el("h2",{},"Os itens desta prova"),
      el("p",{class:"sub"},"Cada ponto é um item. A faixa sombreada marca os "+
        "tercis de dificuldade deste ano — a escala é progressiva, então "+
        "difícil no 3EF não é difícil no 3EM."),dispersao(lista)),
    corpo);
}
function tile(n,r,aviso=false){
  return el("div",{class:"tile"+(aviso?" aviso":"")},
    el("div",{class:"n"},String(n)),el("div",{class:"r"},r));
}

function abaDistribuicao(){
  const lista=provaDe(comp,ano);
  const linhas=DADOS.anos.map(a=>{
    const l=provaDe(comp,a), bs=l.map(i=>i.b);
    const [q1,q2]=cortesAno(comp,a);
    const c={facil:0,medio:0,dificil:0};
    for(const it of l) c[faixaDe(it,q1,q2)]++;
    return {a,n:l.length,m:media(bs),s:dp(bs),am:media(l.map(i=>i.a)),
      cx:l.filter(i=>i.t==="conexao").length,
      fora:l.filter(i=>i.ai&&i.ai!==a).length,
      fmd:`${c.facil}·${c.medio}·${c.dificil}`};});
  const t=el("table",{},el("thead",{},el("tr",{},
    ...["ano","itens","b médio","dp de b","a médio","conexão",
        "fácil·médio·difícil","de outro ano"].map(h=>el("th",{},h)))),
    el("tbody",{},...linhas.map(r=>el("tr",{},
      el("td",{},r.a),el("td",{class:"num"},r.n),
      el("td",{class:"num"},f2(r.m)),el("td",{class:"num"},r.s.toFixed(2)),
      el("td",{class:"num"},r.am.toFixed(2)),el("td",{class:"num"},r.cx),
      el("td",{class:"num"},r.fmd),el("td",{class:"num"},r.fora)))));
  /* Uma escala só para os dez anos: x comum, y comum. É o que permite ver
     a prova do 3EF encostada à esquerda e a do 3EM espalhada à direita. */
  const passo=.5;
  let bx0=Infinity, bx1=-Infinity, by=1;
  const porAno=DADOS.anos.map(a=>{
    const l=provaDe(comp,a), bins={};
    for(const it of l){const k=Math.floor(it.b/passo)*passo;
      bins[k]=(bins[k]||0)+1;
      if(k<bx0) bx0=k; if(k+passo>bx1) bx1=k+passo;}
    by=Math.max(by,...Object.values(bins),1);
    return {a,l};});
  if(!isFinite(bx0)){bx0=-3;bx1=3;}
  const graficos=el("div",{});
  porAno.forEach(({a,l},i)=>{
    const [q1,q2]=cortesAno(comp,a);
    const c={facil:0,medio:0,dificil:0};
    for(const it of l) c[faixaDe(it,q1,q2)]++;
    graficos.append(
      el("div",{class:"gtit"+(a===ano?" atual":"")},
        el("b",{},`${comp} ${a}`),
        el("span",{},`${l.length} ite${l.length===1?"m":"ns"} · `+
          `${c.facil}F ${c.medio}M ${c.dificil}D · `+
          `cortes ${f2(q1)} e ${f2(q2)}`)),
      histograma(l,{x0:bx0,x1:bx1,y1:by,cortes:[q1,q2],H:150,
        tx:i===porAno.length-1?"dificuldade  b":""}));
  });
  return el("div",{},
    el("div",{class:"cartao"},
      el("h2",{},`Distribuição de dificuldade · ${comp}`),
      graficos),
    el("div",{class:"cartao"},el("h2",{},"Todos os anos deste componente"),
      el("p",{class:"sub"},"recalculado com as suas decisões. Os tercis são "+
        "de cada ano, então as colunas fácil/médio/difícil não se comparam "+
        "entre anos: por construção, cada ano tem um terço em cada faixa."),
      el("div",{class:"rolagem"},t)));
}
function abaEscala(){
  return el("div",{},
    el("div",{class:"cartao"},
      el("h2",{},"Progressão da escala"),
      el("p",{class:"sub"},"dificuldade média da prova de cada ano, nos dois "+
        "componentes, recalculada a cada troca que você faz"),progressao()));
}
function abaDescritores(){
  return el("div",{},
    el("div",{class:"cartao"},el("h2",{},`Descritores · ${comp} ${ano}`),
      el("p",{class:"sub"},"cada coluna é um descritor, ordenado do mais fácil "+
        "ao mais difícil; cada ponto é um item dele"),
      descritores(provaDe(comp,ano))));
}

/* ------------------------------------------------------------ exportar/abrir */
function exportar(){
  const linhas=[];
  for(const c of ["LP","MT"]) for(const a of DADOS.anos)
    for(const it of DADOS.itens[c].filter(i=>i.an===a)){
      const d=dec(c,a,it.c);
      if(d.st==="pendente") continue;
      linhas.push({componente:c,ano:a,codigo_original:it.c,
        descritor:DADOS.descritores[it.d],decisao:d.st,
        codigo_substituto:d.por||""});
    }
  const pacote={gerado_em:new Date().toISOString(),
    base:DADOS.gerado,total_decisoes:linhas.length,decisoes:linhas};
  baixar("validacao_prova_somativa.json",
    JSON.stringify(pacote,null,1),"application/json");
  const csv=["componente;ano;codigo_original;descritor;decisao;codigo_substituto"]
    .concat(linhas.map(l=>[l.componente,l.ano,l.codigo_original,
      '"'+l.descritor.replace(/"/g,'""')+'"',l.decisao,l.codigo_substituto]
      .join(";"))).join("\n");
  baixar("validacao_prova_somativa.csv","﻿"+csv,"text/csv");
}
function baixar(nome,txt,tipo){
  const u=URL.createObjectURL(new Blob([txt],{type:tipo+";charset=utf-8"}));
  const a=document.createElement("a");
  a.href=u; a.download=nome; document.body.append(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),2000);
}
$("#btnExportar").addEventListener("click",exportar);
$("#btnImportar").addEventListener("click",()=>$("#arqImport").click());
$("#arqImport").addEventListener("change",ev=>{
  const f=ev.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{
      const p=JSON.parse(r.result);
      const tocadas=[];
      for(const l of (p.decisoes||[])){
        const k=kd(l.componente,l.ano,l.codigo_original);
        decisoes[k]={st:l.decisao,por:l.codigo_substituto||"",nota:"",
                     ts:Date.now()};
        tocadas.push(k);
      }
      for(const k of tocadas) salvar(k);
      if(!tocadas.length) salvar();
      desenhar();
    }catch(e){ alert("Não consegui ler esse arquivo."); } };
  r.readAsText(f); ev.target.value="";
});

/* ------------------------------------------------------------------ desenho */
const ABAS=[["prova","Prova do ano"],["distribuicao","Distribuição"],
            ["descritores","Descritores"],["escala","Progressão da escala"]];
function desenhar(){
  const sc=$("#segComp"); sc.replaceChildren(...["LP","MT"].map(c=>
    el("button",{"aria-pressed":comp===c,onclick:()=>{comp=c;desenhar();}},
      c==="LP"?"Língua Portuguesa":"Matemática")));
  const sa=$("#segAno"); sa.replaceChildren(...DADOS.anos.map(a=>
    el("button",{"aria-pressed":ano===a,onclick:()=>{ano=a;desenhar();}},a)));
  $("#abas").replaceChildren(...ABAS.map(([k,r])=>
    el("button",{"aria-selected":aba===k,onclick:()=>{aba=k;desenhar();}},r)));
  let tot=0,fei=0;
  for(const c of ["LP","MT"]) for(const it of DADOS.itens[c]){
    tot++; if(dec(c,it.an,it.c).st!=="pendente") fei++;}
  $("#progresso").textContent=`${fei} de ${tot} itens revisados`;
  const p=$("#palco");
  p.replaceChildren(aba==="prova"?abaProva():aba==="distribuicao"?
    abaDistribuicao():aba==="descritores"?abaDescritores():abaEscala());
  window.scrollTo({top:0});
}
desenhar();

/* Liga a sincronização: puxa o que já existe, manda o que ficou na fila de
   uma sessão anterior e passa a conferir de tempos em tempos. */
if(SINC){
  aviso("conectando…");
  puxar(true);
  enviar();
  setInterval(()=>{ puxar(false); enviar(); },
              Math.max(5, SINC.intervalo||15)*1000);
  window.addEventListener("online", ()=>{ puxar(false); enviar(); });
  /* Voltar para a aba é o momento em que a pessoa mais precisa do estado
     fresco: ela acabou de olhar a planilha, ou de falar com alguém. O
     navegador também atrasa os temporizadores de abas em segundo plano, então
     sem isto uma aba esquecida volta desatualizada. */
  document.addEventListener("visibilitychange",()=>{
    if(!document.hidden){ puxar(false); enviar(); }});
  window.addEventListener("focus",()=>{ puxar(false); enviar(); });
}
</script>
